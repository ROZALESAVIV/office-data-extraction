[project]
name = "office-data-extraction"
version = "0.1.0"
description = "Extract structured data from Israeli legal case documents and submit it to Odcanit."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: hits the real Claude API; skipped unless explicitly selected",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle. I = import sorting. B = common bugs. UP = modern syntax.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # FastAPI's dependency injection *requires* calls in argument defaults
    # (`ctx = Depends(...)`). This rule cannot be satisfied without breaking it.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are append-only history. Reformatting an applied migration gains
# nothing and makes `git blame` on the schema useless.
"alembic/versions/*" = ["E501", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
